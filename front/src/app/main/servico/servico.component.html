<div class="grid">
    <div class="col-12">
        <div class="card px-4 py-4 md:px-6 md:py-5">
            <p-toolbar styleClass="mb-4 gap-2">
                <ng-template pTemplate="left">
                    <button pButton pRipple label="Novo serviço" icon="pi pi-plus" class="p-button-success"
                        (click)="abrirNovo()"></button>
                </ng-template>
                <ng-template pTemplate="right">
                    <button pButton pRipple label="Exportar CSV" icon="pi pi-download"
                        class="p-button-help p-button-outlined" (click)="dt.exportCSV()"></button>
                </ng-template>
            </p-toolbar>

            <!-- Tabela de preços dos serviços; o valor sai em reais pelo pipe currency - [Otávio Michels] -->
            <p-table #dt [value]="servicos" [columns]="colunasCsv" exportFilename="servicos-e-precos" [loading]="carregando"
                responsiveLayout="stack" breakpoint="960px" [rows]="10" [paginator]="true"
                [rowsPerPageOptions]="[10, 20, 50]" [showCurrentPageReport]="true"
                currentPageReportTemplate="{first} a {last} de {totalRecords} serviços"
                [globalFilterFields]="['nome', 'descricao']" [rowHover]="true" dataKey="id">
                <ng-template pTemplate="caption">
                    <div class="flex flex-column md:flex-row md:justify-content-between md:align-items-center gap-2">
                        <h5 class="m-0">Serviços e preços</h5>
                        <span class="block p-input-icon-left">
                            <i class="pi pi-search"></i>
                            <input pInputText type="text" (input)="onGlobalFilter(dt, $event)"
                                placeholder="Buscar serviço..." class="w-full sm:w-20rem" />
                        </span>
                    </div>
                </ng-template>
                <ng-template pTemplate="header">
                    <tr>
                        <th pSortableColumn="nome">Serviço <p-sortIcon field="nome"></p-sortIcon></th>
                        <th>Descrição</th>
                        <th pSortableColumn="preco" class="text-right">Preço <p-sortIcon field="preco"></p-sortIcon></th>
                        <th class="text-right">Ações</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-s>
                    <tr>
                        <td><span class="p-column-title">Serviço</span><span class="font-medium">{{ s.nome }}</span></td>
                        <td><span class="p-column-title">Descrição</span><span class="text-600">{{ s.descricao || '—' }}</span></td>
                        <td class="text-right">
                            <span class="p-column-title">Preço</span>
                            <span class="font-medium">{{ s.preco | currency:'BRL' }}</span>
                        </td>
                        <td>
                            <span class="p-column-title">Ações</span>
                            <div class="flex md:justify-content-end gap-2">
                                <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success"
                                    pTooltip="Editar" (click)="editar(s)"></button>
                                <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning"
                                    pTooltip="Excluir" (click)="excluir(s)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>
                <ng-template pTemplate="emptymessage">
                    <tr><td colspan="4" class="text-center p-4">Nenhum serviço cadastrado.</td></tr>
                </ng-template>
            </p-table>
        </div>

        <!-- Cadastro e edição do serviço; o preço é digitado já no formato R$ 0,00 - [Gabriel França] -->
        <p-dialog [(visible)]="servicoDialog" [style]="{ width: '480px' }" [breakpoints]="{ '640px': '95vw' }"
            [header]="servico.id ? 'Editar serviço' : 'Novo serviço'" [modal]="true" class="p-fluid">
            <ng-template pTemplate="content">
                <div class="field">
                    <label for="nome">Nome *</label>
                    <input pInputText id="nome" [(ngModel)]="servico.nome" maxlength="80" placeholder="Ex.: Banho"
                        [ngClass]="{ 'campo-invalido': submitted && !servico.nome?.trim() }" />
                    <small class="p-error" *ngIf="submitted && !servico.nome?.trim()">Nome é obrigatório</small>
                </div>
                <div class="field">
                    <label for="descricao">Descrição</label>
                    <textarea pInputTextarea id="descricao" [(ngModel)]="servico.descricao" rows="2" [autoResize]="true"
                        placeholder="Ex.: banho com shampoo neutro, secagem e perfume"></textarea>
                </div>
                <div class="field">
                    <label for="preco">Preço *</label>
                    <p-inputNumber inputId="preco" [(ngModel)]="servico.preco" mode="currency" currency="BRL"
                        locale="pt-BR" [min]="0" [maxFractionDigits]="2" placeholder="R$ 0,00"
                        [ngClass]="{ 'campo-invalido': submitted && precoFaltando }"></p-inputNumber>
                    <small class="p-error" *ngIf="submitted && precoFaltando">Preço é obrigatório</small>
                </div>
            </ng-template>

            <ng-template pTemplate="footer">
                <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text"
                    (click)="servicoDialog = false"></button>
                <button pButton pRipple label="Salvar" icon="pi pi-check" [loading]="salvando"
                    (click)="salvar()"></button>
            </ng-template>
        </p-dialog>
    </div>
</div>
